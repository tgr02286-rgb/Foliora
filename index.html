<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10131b"><title>FF WAR ZONE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131b;color:#fff;font-family:system-ui,Arial;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:radial-gradient(ellipse at center,#26313a 0,#111820 70%)}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;font-weight:800;text-shadow:0 2px 4px #000}
.pill{background:#161d28dd;border:1px solid #536170;border-radius:12px;padding:8px 12px}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080c12cc;text-align:center;padding:24px}
.panel{max-width:360px;background:#171f2b;border:1px solid #536170;border-radius:20px;padding:24px;box-shadow:0 15px 50px #0008}
h1{margin:0 0 8px;color:#ff3c56;letter-spacing:1px}button{border:0;border-radius:14px;padding:14px 22px;background:#ff294b;color:white;font-weight:900;font-size:17px}
#controls{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.ctrl{pointer-events:auto;width:76px;height:76px;border-radius:50%;background:#202d3ddd;border:2px solid #8fa3b8;color:#fff;font-size:26px;font-weight:900}
#hint{font-size:13px;color:#c3ccd5;line-height:1.5}
</style></head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="pill">❤️ <span id="hp">100</span></div><div class="pill">SCORE: <span id="score">0</span></div><div class="pill">AMMO: <span id="ammo">∞</span></div></div>
<div id="overlay"><div class="panel"><h1>FF WAR ZONE</h1><p id="message">Battle Arena-তে শত্রুদের লক্ষ্য করে গুলি করো!</p><p id="hint">স্ক্রিনে ট্যাপ করলে গুলি হবে। বাম/ডান বোতামে নড়াচড়া করো।</p><button id="start">START BATTLE</button></div></div>
<div id="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,player,enemies=[],bullets=[],score=0,hp=100,running=false,move=0,last=0,spawn=0;
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;player={x:W/2,y:H-125,r:18}}
addEventListener('resize',resize);resize();
function enemy(){enemies.push({x:35+Math.random()*(W-70),y:-30,r:17,s:1.1+Math.random()*1.2})}
function shoot(x,y){bullets.push({x,y,v:8})}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.strokeStyle='#263744';ctx.lineWidth=1;for(let x=0;x<W;x+=42){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 // player
 ctx.fillStyle='#28a8ff';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d9f2ff';ctx.fillRect(player.x-4,player.y-25,8,18);
 enemies.forEach(e=>{ctx.fillStyle='#ff4359';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(e.x-7,e.y-4,4,4);ctx.fillRect(e.x+4,e.y-4,4,4)});
 ctx.fillStyle='#ffe16a';bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill()});
}
function loop(t){if(!running)return;let dt=Math.min((t-last)/16.67||1,2);last=t;player.x=Math.max(22,Math.min(W-22,player.x+move*4*dt));spawn+=dt;if(spawn>48){enemy();spawn=0}
 bullets.forEach(b=>b.y-=b.v*dt);enemies.forEach(e=>e.y+=e.s*dt);
 for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];let hit=bullets.findIndex(b=>Math.hypot(b.x-e.x,b.y-e.y)<e.r+5);if(hit>=0){bullets.splice(hit,1);enemies.splice(i,1);score+=10}else if(e.y>H-90){enemies.splice(i,1);hp-=15}}
 bullets=bullets.filter(b=>b.y>-10);document.getElementById('score').textContent=score;document.getElementById('hp').textContent=hp;draw();
 if(hp<=0){running=false;document.getElementById('message').textContent='Game Over! তোমার স্কোর: '+score;document.getElementById('start').textContent='PLAY AGAIN';document.getElementById('overlay').style.display='flex';return}
 requestAnimationFrame(loop)}
function start(){score=0;hp=100;enemies=[];bullets=[];player.x=W/2;running=true;last=0;spawn=0;document.getElementById('overlay').style.display='none';requestAnimationFrame(loop)}
document.getElementById('start').onclick=start;
document.getElementById('left').onpointerdown=()=>move=-1;document.getElementById('right').onpointerdown=()=>move=1;
['left','right'].forEach(id=>{document.getElementById(id).onpointerup=()=>move=0;document.getElementById(id).onpointerleave=()=>move=0;});
c.addEventListener('pointerdown',e=>{if(running)shoot(e.clientX,e.clientY)});
draw();
</script></body></html>
